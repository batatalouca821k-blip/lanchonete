services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lanchonete
      POSTGRES_USER: lanchonete
      POSTGRES_PASSWORD: lanchonete_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanchonete -d lanchonete"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
